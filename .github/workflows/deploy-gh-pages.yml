name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DIESW_ASSETS_DIR: ${{ github.workspace }}/.cache/diesw-assets
      DIESW_ASSETS_REF: ${{ vars.DIESW_ASSETS_REF || 'main' }}
      DIESW_ASSETS_REPOSITORY: ${{ vars.DIESW_ASSETS_REPOSITORY || 'dieWehmut/diesw-assets' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Checkout capture assets
        working-directory: frontend
        env:
          DIESW_ASSETS_TOKEN: ${{ secrets.DIESW_ASSETS_TOKEN }}
        run: node scripts/checkout-assets-repo.mjs

      - name: Report assets revision
        run: |
          echo "diesw-assets repository: $DIESW_ASSETS_REPOSITORY@$DIESW_ASSETS_REF"
          echo "Pulled HEAD: $(git -C "$DIESW_ASSETS_DIR" rev-parse HEAD)"
          git -C "$DIESW_ASSETS_DIR" log -1 --pretty='  %h %ci %s'

      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE: ''
          VITE_BASE_PATH: /monogatari/
          VITE_STATIC_STORY: 'true'
          VITE_STATIC_AUTH: 'false'
          VITE_AUTH_ENABLE_GITHUB: 'false'
          VITE_AUTH_ENABLE_GOOGLE: 'false'
          VITE_AUTH_ENABLE_EMAIL: 'false'
          VITE_AUTH_ENABLE_REGISTER: 'false'
          VITE_CAPTURE_GISCUS_REPO: ${{ vars.VITE_CAPTURE_GISCUS_REPO || vars.VITE_GISCUS_REPO }}
          VITE_CAPTURE_GISCUS_REPO_ID: ${{ vars.VITE_CAPTURE_GISCUS_REPO_ID || vars.VITE_GISCUS_REPO_ID }}
          VITE_CAPTURE_GISCUS_CATEGORY: ${{ vars.VITE_CAPTURE_GISCUS_CATEGORY || vars.VITE_GISCUS_CATEGORY }}
          VITE_CAPTURE_GISCUS_CATEGORY_ID: ${{ vars.VITE_CAPTURE_GISCUS_CATEGORY_ID || vars.VITE_GISCUS_CATEGORY_ID }}
          VITE_CAPTURE_GISCUS_MAPPING: ${{ vars.VITE_CAPTURE_GISCUS_MAPPING || vars.VITE_GISCUS_MAPPING || 'specific' }}
          VITE_CAPTURE_GISCUS_STRICT: ${{ vars.VITE_CAPTURE_GISCUS_STRICT || vars.VITE_GISCUS_STRICT || '0' }}
          VITE_CAPTURE_GISCUS_REACTIONS_ENABLED: ${{ vars.VITE_CAPTURE_GISCUS_REACTIONS_ENABLED || vars.VITE_GISCUS_REACTIONS_ENABLED || '1' }}
          VITE_CAPTURE_GISCUS_INPUT_POSITION: ${{ vars.VITE_CAPTURE_GISCUS_INPUT_POSITION || vars.VITE_GISCUS_INPUT_POSITION || 'bottom' }}
          VITE_CAPTURE_GISCUS_THEME: ${{ vars.VITE_CAPTURE_GISCUS_THEME || vars.VITE_GISCUS_THEME || 'nexus' }}
          VITE_CAPTURE_GISCUS_LANG: ${{ vars.VITE_CAPTURE_GISCUS_LANG || vars.VITE_GISCUS_LANG || 'zh-CN' }}
        run: pnpm build

      - name: Deploy
        run: |
          mkdir gh-pages
          cp -r frontend/dist/* gh-pages/

          cd gh-pages
          touch .nojekyll
          cp index.html 404.html

          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "deploy: $GITHUB_SHA"

          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages
